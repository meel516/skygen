# nginx config for local Windows testing — listens on 8080 (port 80 is taken)
# Forwards /api/ai/wizard/* to Mastra (:4111), everything else to Next.js (:3000)

worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events { worker_connections 1024; }

http {
    include C:/Users/SaleemMohammed/Downloads/nginx-1.31.2/nginx-1.31.2/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream nextjs { server 127.0.0.1:3000; }
    upstream mastra { server 127.0.0.1:4111; }

    server {
        listen 8080;
        server_name localhost;

        # Wizard routes → Mastra (with prefix rewrite)
        # /api/ai/wizard/chat → /wizard/chat
        location /api/ai/wizard/ {
            rewrite ^/api/ai/wizard/(.*)$ /wizard/$1 break;
            proxy_pass http://mastra;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        # Everything else → Next.js
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
