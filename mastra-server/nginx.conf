# nginx.conf — reverse proxy splitting Next.js and the standalone Mastra server.
#
# Drop in /etc/nginx/sites-available/ and symlink to sites-enabled/.
# Browser → /api/ai/wizard/* is rewritten to /wizard/* and proxied to Mastra
# (port 4111). Everything else goes to Next.js (port 3000). The session cookie
# is forwarded so the Mastra server can verify the NextAuth JWT.

upstream nextjs   { server 127.0.0.1:3000; }
upstream mastra   { server 127.0.0.1:4111; }

server {
    listen 80;
    server_name _;  # replace with your domain

    # Wizard routes → Mastra server (with prefix rewrite)
    location /api/ai/wizard/ {
        # Rewrite /api/ai/wizard/chat → /wizard/chat
        rewrite ^/api/ai/wizard/(.*)$ /wizard/$1 break;

        proxy_pass http://mastra;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # SSE: disable buffering, pass through keep-alive
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;  # matches chat route's maxDuration
        chunked_transfer_encoding on;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
